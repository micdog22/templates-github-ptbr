# Atualizações automáticas de dependências com o Dependabot.
# Mantenha só os ecossistemas que o projeto usa (os outros geram erro no Dependabot)
# e ajuste "directory" se o package.json, requirements.txt ou pyproject.toml não
# estiver na raiz. Documentação: https://docs.github.com/pt/code-security/dependabot
version: 2
updates:
  # Pacotes do npm (package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # Pacotes Python (requirements.txt, pyproject.toml, Pipfile)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # Actions usadas nos workflows de .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
